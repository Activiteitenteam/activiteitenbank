<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workshops beheren - Activiteitenbank.nl</title>
<link rel="stylesheet" href="style.css?v=11">
<link rel="icon" href="Assets/favicon.svg?v=11" type="image/svg+xml">
<link rel="alternate icon" href="Assets/favicon.ico?v=11" sizes="32x32">
<link rel="apple-touch-icon" href="Assets/favicon-180.png?v=11">
<script>
  // Thema toepassen voor het tekenen, anders flitst de lichte versie door.
  try {
    var bewaardThema = localStorage.getItem('activiteitenbank-thema');
    if (bewaardThema === 'donker') document.documentElement.dataset.thema = 'donker';
  } catch (e) {}
</script>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="index.html">
      <span>Acti</span><span>vi</span><span>tei</span><span>ten</span><span>ba</span><span>nk</span><span class="nl">.nl</span>
    </a>
    <nav aria-label="Hoofdmenu">
      <ul>
        <li><a class="nav-losse" href="losse-activiteiten.html">Losse activiteiten</a></li>
        <li><a class="nav-thema" href="thema-paginas.html">Thema pagina's</a></li>
        <li><a class="nav-prikbord" href="workshop-prikbord.html">Workshop prikbord</a></li>
      </ul>
    </nav>
  </div>
</header>

<section class="werkblad" id="werkblad" hidden>
  <div class="werkbalk">
    <div class="werkbalk-kop">
      <h2><a class="terug-naar-admin" href="admin.html">Admin</a> &rsaquo; Workshops</h2>
      <span class="werkbalk-telling" id="ws-telling"></span>
    </div>
    <div class="werkbalk-acties">
      <button type="button" class="knop knop-secundair knop-klein uitloggen-knop">Uitloggen</button>
    </div>
  </div>

  <div class="werkblad-kolommen">
    <div class="werkblad-lijst">
      <div class="extra-lijst" id="ws-lijst"></div>
    </div>

    <div class="werkblad-editor">
      <div class="beheer-paneel">
        <form class="formulier" id="ws-form">
          <h3 id="ws-formtitel">Nieuw item</h3>
          <div class="veld-groep">
            <label for="ws-titel">Titel</label>
            <input type="text" id="ws-titel" placeholder="Bijv. Djembé voor kids" required>
          </div>
          <div class="veld-groep">
            <label for="ws-tekst">Korte omschrijving</label>
            <input type="text" id="ws-tekst" placeholder="Wat houdt de workshop in?">
          </div>
          <div class="veld-groep">
            <label for="ws-door">Aangeboden door</label>
            <input type="text" id="ws-door" placeholder="Wie geeft hem?">
          </div>
          <div class="veld-groep">
            <label for="ws-duur">Duur</label>
            <input type="text" id="ws-duur" placeholder="Bijv. 45 minuten">
          </div>
          <div class="form-knoppen">
            <button type="button" class="knop knop-secundair" id="ws-annuleer" hidden>Annuleren</button>
            <button type="submit" class="knop" id="ws-opslaan">Toevoegen</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="footer-inner">
    <div class="endorser">
      <img class="endorser-logo" src="Assets/vlietkinderen-wit.png?v=11"
           alt="Vlietkinderen" width="640" height="87">
    </div>
    <p class="copy">&copy; 2026 Activiteitenbank.nl</p>
    <button type="button" class="thema-schakelaar" id="thema-schakelaar" aria-pressed="false">
      <span class="thema-spoor" aria-hidden="true"><span class="thema-knop"></span></span>
      <span class="thema-label">Nachtmodus</span>
    </button>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="admin-auth.js?v=11"></script>
<script src="data.js?v=11"></script>
<script src="admin-lijstbeheer.js?v=11"></script>
<script>
  (async () => {
    if (!await vereisLogin()) return;
    koppelUitloggen();

    let activiteiten = await laadActiviteiten();
    document.getElementById('werkblad').hidden = false;

    const beheer = beheerLijstje({
      sleutel: 'ws',
      velden: ['titel', 'tekst', 'door', 'duur'],
      veldSleutel: v => (v === 'tekst' ? 'samenvatting' : v),
      nieuwKop: 'Nieuwe workshop',
      bewerkKop: 'Workshop bewerken',
      leegTekst: 'Nog geen workshops op het prikbord.',
      activiteiten: () => activiteiten,
      lees: () => workshopsLijst(),
      zet: items => zetWorkshops(items),
      bijschrift: w => [w.door ? 'door ' + w.door : '', w.duur].filter(Boolean).join(' · '),
      bouw: invoer => {
        const titel = invoer.titel.value.trim();
        if (!titel) return null;
        return {
          titel,
          samenvatting: invoer.tekst.value.trim(),
          door: invoer.door.value.trim(),
          duur: invoer.duur.value.trim()
        };
      }
    });

    beheer.teken();
    document.getElementById('ws-telling').textContent =
      workshopsLijst().length + ' workshops';
  })();
</script>
<script src="thema.js?v=11"></script>
</body>
</html>
