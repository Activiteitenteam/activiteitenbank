<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Even geduld - Activiteitenbank.nl</title>
<link rel="stylesheet" href="style.css">
<script>
  // Thema toepassen vóór het tekenen, anders flitst de lichte versie door.
  // Zonder eerdere keuze blijft de site licht; de schakelaar in de footer beslist.
  try {
    var bewaardThema = localStorage.getItem('activiteitenbank-thema');
    if (bewaardThema === 'donker') document.documentElement.dataset.thema = 'donker';
  } catch (e) {}
</script>
</head>
<body class="onderhoud-pagina">

<!-- Geen navigatie: de rest van de site is tijdelijk niet beschikbaar. -->
<header>
  <div class="header-inner">
    <span class="logo">
      <span>Acti</span><span>vi</span><span>tei</span><span>ten</span><span>ba</span><span>nk</span><span class="nl">.nl</span>
    </span>
  </div>
</header>

<main class="hero onderhoud">
  <div class="hero-slide actief" style="background-image: url('Assets/Banner/ben-wicks-iDCtsz-INHI-unsplash.jpg')"></div>
  <div class="hero-slide" style="background-image: url('Assets/Banner/ashton-bingham-SAHBl2UpXco-unsplash.jpg')"></div>
  <div class="hero-slide" style="background-image: url('Assets/Banner/compagnons-OV44gxH71DU-unsplash.jpg')"></div>
  <div class="hero-overlay"></div>

  <div class="hero-inhoud onderhoud-inhoud">
    <span class="onderhoud-emoji" role="img" aria-label="In aanbouw">🚧</span>
    <h1>Even geduld</h1>
    <p>Het Vlietkinderen Activiteitenteam is bezig met de website&hellip; kom later terug!</p>
    <p class="onderhoud-iconen" aria-hidden="true">🎨 &middot; 🧩 &middot; 🌳</p>
    <a class="knop knop-licht" href="admin.html">Admin login</a>
  </div>
</main>

<footer>
  <div class="footer-inner">
    <div class="endorser">
      <span class="v">V</span>
      <span class="tekst">
        <small>In samenwerking met</small>
        <strong>Vlietkinderen</strong>
      </span>
    </div>
    <p class="copy">&copy; 2026 Activiteitenbank.nl</p>
    <button type="button" class="thema-schakelaar" id="thema-schakelaar" aria-pressed="false">
      <span class="thema-spoor" aria-hidden="true"><span class="thema-knop"></span></span>
      <span class="thema-label">Nachtmodus</span>
    </button>
  </div>
</footer>

<script src="hero.js"></script>
<script src="fade.js"></script>
<script src="thema.js"></script>
</body>
</html>
