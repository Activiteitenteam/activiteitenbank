<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thema pagina's - Activiteitenbank.nl</title>
<link rel="stylesheet" href="style.css?v=24">
<link rel="icon" href="Assets/favicon.svg?v=24" type="image/svg+xml">
<link rel="alternate icon" href="Assets/favicon.ico?v=24" sizes="32x32">
<link rel="apple-touch-icon" href="Assets/favicon-180.png?v=24">
<script>
  // Thema toepassen vóór het tekenen, anders flitst de lichte versie door.
  // Zonder eerdere keuze blijft de site licht; de schakelaar in de footer beslist.
  try {
    var bewaardThema = localStorage.getItem('activiteitenbank-thema');
    if (bewaardThema === 'donker') document.documentElement.dataset.thema = 'donker';
  } catch (e) {}
</script>
<script src="onderhoudmodus.js?v=24"></script>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="index.html">
      <span>Acti</span><span>vi</span><span>tei</span><span>ten</span><span>ba</span><span>nk</span><span class="nl">.nl</span>
    </a>
    <nav aria-label="Hoofdmenu">
      <ul>
        <li><a class="nav-losse" href="losse-activiteiten.html">Losse activiteiten</a></li>
        <li><a class="nav-thema actief" href="thema-paginas.html">Thema pagina's</a></li>
        <li><a class="nav-prikbord" href="workshop-prikbord.html">Workshop prikbord</a></li>
      </ul>
    </nav>
  </div>
</header>

<div class="hero hero-sub hero-thema">
  <div class="hero-overlay"></div>
  <div class="hero-inhoud">
    <h1>Thema pagina's</h1>
    <p>Uitgewerkte thema's met een week (of langer) aan samenhangende activiteiten.</p>
  </div>
</div>

<section class="blok titel-thema">
  <div class="items" id="thema-lijst"></div>
</section>

<footer>
  <div class="footer-inner">
    <div class="endorser">
      <img class="endorser-logo" src="Assets/vlietkinderen-wit.png?v=24"
           alt="Vlietkinderen" width="640" height="87">
    </div>
    <p class="copy">&copy; 2026 Activiteitenbank.nl &middot; <a class="admin-link" href="admin.html">Admin login</a></p>
    <button type="button" class="thema-schakelaar" id="thema-schakelaar" aria-pressed="false">
      <span class="thema-spoor" aria-hidden="true"><span class="thema-knop"></span></span>
      <span class="thema-label">Nachtmodus</span>
    </button>
  </div>
</footer>

<script src="data.js?v=24"></script>
<script src="themas.js?v=24"></script>
<script src="thema-lijst.js?v=24"></script>
<script src="hero.js?v=24"></script>
<script src="thema.js?v=24"></script>
</body>
</html>
